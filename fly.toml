# fly.toml app configuration file generated for videoparty on 2026-07-28T16:05:32Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'videoparty'
primary_region = 'ord'

[build]

[env]
  ASPNETCORE_ENVIRONMENT = 'Production'
  ASPNETCORE_FORWARDEDHEADERS_ENABLED = 'true'
  ASPNETCORE_HTTP_PORTS = '8080'
  ConnectionStrings__DefaultConnection = 'Data Source=/data/videoparty.db'

[[mounts]]
  source = 'data'
  destination = '/data'
  initial_size = '1gb'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  # SignalR connections require an always-available server. Keep one Machine
  # running, but do not create additional Machines automatically.
  min_machines_running = 1

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1

[[mounts]]
  source = "data"
  destination = "/data"
  initial_size = "1gb"

# Keep exactly one deployed Machine (this is Fly app state, not a fly.toml
# setting): fly scale count 1
